<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>水下载具三维导航演示</title>
<link rel="stylesheet" href="/styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>水下载具 · 立体导航</h1>
    <p class="sub">真三维配置空间 A* + 有向盒扫掠碰撞核验</p>

    <section>
      <h2>1 · 场景（程序生成障碍）</h2>
      <div id="scenarioButtons" class="btn-row"></div>
      <p id="scenarioDesc" class="desc"></p>
    </section>

    <section>
      <h2>2 · 载具尺寸（米）</h2>
      <label>长 <input type="number" id="vLen" step="0.1" min="0.2" />
        <button class="mini" data-preset="nominal">标准</button>
        <button class="mini" data-preset="fat">加宽</button></label>
      <label>宽 <input type="number" id="vWid" step="0.1" min="0.2" /></label>
      <label>高 <input type="number" id="vHgt" step="0.1" min="0.2" /></label>
    </section>

    <section>
      <h2>3 · 目标点</h2>
      <p class="desc">点击「点选目标」后在水体中点击任意位置；或选择预设目标。</p>
      <div class="btn-row">
        <button id="pickMode">点选目标</button>
        <button id="resetGoal">用预设目标</button>
      </div>
      <div id="goalList" class="goal-list"></div>
      <div class="coords">起点 <span id="startText"></span></div>
      <div class="coords">目标 <span id="goalText"></span></div>
    </section>

    <section>
      <h2>4 · 体空间剖面</h2>
      <label class="clip">剖切轴
        <select id="clipAxis">
          <option value="0">X</option><option value="1">Y</option>
          <option value="2" selected>Z</option>
        </select>
      </label>
      <label class="clip">剖切位置 <input type="range" id="clipSlider" min="0" max="1000" value="1000" />
        <span id="clipValue">关闭</span></label>
      <label class="clip"><input type="checkbox" id="showGrid" /> 显示配置空间阻挡体素</label>
      <label class="clip"><input type="checkbox" id="showReached" checked /> 失败时显示可达自由分量</label>
    </section>

    <section>
      <h2>5 · 运行</h2>
      <div class="btn-row">
        <button id="run" class="primary">运行载具导航</button>
        <button id="play" disabled>▶ 沿路径行驶</button>
        <button id="stop">■</button>
      </div>
      <label class="clip">行驶速度 <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1" />
        <span id="speedValue">1.0×</span></label>
    </section>

    <section>
      <h2>6 · 诊断探针（沿路径回查）</h2>
      <div class="btn-row">
        <button id="diagnose">运行诊断探针</button>
        <button id="showSwept">显示扫掠体</button>
      </div>
      <p class="desc">固定障碍只改网格原点（探针 A）或固定折线只换平滑器（探针 B），定位最早改变可达结论的体素/线段，并保存每个案例的载具朝向与扫掠体。</p>
      <div id="diagBox" class="diag hidden"></div>
    </section>

    <section id="results">
      <h2>结果区</h2>
      <div id="status" class="status idle">尚未运行</div>
      <div id="metrics"></div>
      <div id="failureBox" class="failure hidden"></div>
      <div class="legend">
        <span><i class="sw-path"></i>载具实算路径</span>
        <span><i class="sw-block"></i>阻断体积</span>
        <span><i class="sw-reach"></i>可达自由分量</span>
        <span><i class="sw-grid"></i>配置空间阻挡体素</span>
      </div>
    </section>
  </aside>

  <main id="viewport">
    <canvas id="scene"></canvas>
    <div id="hud">
      <span id="hudClearance"></span>
      <span id="hudHint">左键旋转 · 右键平移 · 滚轮缩放</span>
    </div>
  </main>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
